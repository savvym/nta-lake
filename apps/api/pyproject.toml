[project]
name = "dataplat-api"
version = "0.0.0"
description = "dataplat FastAPI 后端：Catalog / Repo API / Orchestrator / Lineage / LLM Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<0.130",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6,<3",
    "httpx>=0.27",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "botocore>=1.34",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "rq>=2.0",
    "redis>=5.0",
    "anthropic>=0.40",
    "PyYAML>=6.0,<7",
    "dataplat-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataplat_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
