[project]
name = "dataplat-worker"
version = "0.0.0"
description = "dataplat 任务执行器：消费 RQ 队列，subprocess 启动 plugin"
requires-python = ">=3.11"
dependencies = [
    "rq>=2.0",
    "redis>=5.0",
    "pydantic>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataplat_worker"]
