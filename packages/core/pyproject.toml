[project]
name = "dataplat-core"
version = "0.0.0"
description = "dataplat 后端 / SDK / worker 共享的 Pydantic 模型与接口协议"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "python-docx>=1.1,<2",
    "python-pptx>=0.6,<2",
    "datasets>=2.14,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataplat_core"]
