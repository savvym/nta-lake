[project]
name = "dataplat-sdk"
version = "0.0.0"
description = "dataplat 用户侧 Python SDK + CLI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6,<3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
dataplat = "dataplat_sdk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataplat_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
