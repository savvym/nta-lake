[project]
name = "dataplat-sdk"
version = "0.0.0"
description = "dataplat 用户侧 Python SDK"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataplat_sdk"]
