<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">dataplat PDF Bronze to Silver to Gold flow</title>
  <desc id="desc">A diagram showing how dataplat turns raw PDF assets in Bronze repositories into standardized Silver text and task-ready Gold training data, with CAS, commit, lineage, and cache as cross-cutting platform mechanisms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef6f4"/>
      <stop offset="1" stop-color="#fff8e7"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7791f"/>
      <stop offset="1" stop-color="#7c4a15"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-dark" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 800 40px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .label { font: 800 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: .4px; }
      .layer-sub { font: 600 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(255,255,255,.86); }
      .card-title { font: 800 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .card-text { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .pill-text { font: 800 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .processor-title { font: 800 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f766e; }
      .processor-text { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .footer-title { font: 800 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .footer-text { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="48" y="44" width="1344" height="812" rx="28" fill="#ffffff" opacity=".72"/>

  <g transform="translate(82 74)">
    <text class="title" x="0" y="0" dominant-baseline="hanging">dataplat / NTA Lake: PDF 数据从 Bronze 到 Silver 到 Gold</text>
    <text class="subtitle" x="0" y="58" dominant-baseline="hanging">基本思想：把原始资料保真入湖，再用可复现 Processor 逐层标准化、结构化，最终产出可训练 / 可评测数据。</text>
  </g>

  <g transform="translate(82 165)">
    <rect x="0" y="0" width="210" height="526" rx="18" fill="#f8fafc" stroke="#dbe3ea"/>
    <text class="card-title" x="28" y="31">外部来源</text>
    <g transform="translate(28 76)">
      <rect x="0" y="0" width="154" height="48" rx="12" fill="#ffffff" stroke="#dbe3ea"/>
      <path d="M24 13 h54 l18 18 v4 h-72 z" fill="#ef4444" opacity=".16"/>
      <path d="M78 13 v18 h18" fill="none" stroke="#ef4444" stroke-width="2"/>
      <text class="mono" x="28" y="33">paper.pdf</text>
    </g>
    <g transform="translate(28 151)">
      <rect x="0" y="0" width="154" height="48" rx="12" fill="#ffffff" stroke="#dbe3ea"/>
      <circle cx="31" cy="24" r="13" fill="#0f766e" opacity=".13"/>
      <path d="M24 24 h14 M31 17 v14" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
      <text class="mono" x="54" y="30">URL / S3</text>
    </g>
    <g transform="translate(28 235)">
      <rect x="0" y="0" width="154" height="96" rx="12" fill="#ecfeff" stroke="#99f6e4"/>
      <text class="processor-title" x="18" y="28">Source Adapter</text>
      <text class="processor-text" x="18" y="53">raw-upload</text>
      <text class="processor-text" x="18" y="74">firecrawl-url</text>
    </g>
    <text class="small" x="28" y="376">把外部文件转成</text>
    <text class="small" x="28" y="400">Bronze Commit</text>
  </g>

  <path d="M292 427 C330 427, 335 427, 374 427" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow-dark)"/>

  <g transform="translate(374 165)" filter="url(#shadow)">
    <rect x="0" y="0" width="285" height="526" rx="22" fill="#ffffff" stroke="#d7c1a2"/>
    <rect x="0" y="0" width="285" height="92" rx="22" fill="url(#bronze)"/>
    <path d="M0 70 h285 v22 h-285 z" fill="url(#bronze)"/>
    <text class="label" x="28" y="29">BRONZE</text>
    <text class="layer-sub" x="28" y="59">原始资产层 / subtype=pdf</text>

    <g transform="translate(28 124)">
      <rect x="0" y="0" width="229" height="136" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
      <text class="card-title" x="20" y="31">Repository</text>
      <text class="mono" x="20" y="61">bronze/demo/raw-pdf@main</text>
      <text class="card-text" x="20" y="94">保留原始 PDF 字节</text>
      <text class="card-text" x="20" y="121">不强制 schema</text>
    </g>

    <g transform="translate(28 292)">
      <rect x="0" y="0" width="229" height="164" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="card-title" x="20" y="31">Commit 内容</text>
      <text class="card-text" x="20" y="64">manifest.yaml</text>
      <text class="card-text" x="20" y="92">pdfs/paper.pdf</text>
      <text class="card-text" x="20" y="120">blob sha256 去重</text>
      <text class="tiny" x="20" y="146">原子写入 Tree + Ref</text>
    </g>
  </g>

  <g transform="translate(693 272)">
    <path d="M0 155 H170" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="17" y="28" width="138" height="104" rx="16" fill="#ecfeff" stroke="#99f6e4"/>
    <text class="processor-title" x="33" y="56">Processor</text>
    <text class="processor-text" x="33" y="82">pdf-mineru@0.1</text>
    <text class="processor-text" x="33" y="104">解析 / OCR / 版面</text>
    <text class="tiny" x="14" y="190">新输出会形成新的 Commit</text>
  </g>

  <g transform="translate(861 165)" filter="url(#shadow)">
    <rect x="0" y="0" width="285" height="526" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="285" height="92" rx="22" fill="url(#silver)"/>
    <path d="M0 70 h285 v22 h-285 z" fill="url(#silver)"/>
    <text class="label" x="28" y="29">SILVER</text>
    <text class="layer-sub" x="28" y="59">标准化中间层 / schema 强制</text>

    <g transform="translate(28 124)">
      <rect x="0" y="0" width="229" height="146" rx="16" fill="#f8fafc" stroke="#dbe3ea"/>
      <text class="card-title" x="20" y="31">PDF 解析产物</text>
      <text class="mono" x="20" y="61">silver/demo/pdf-md@auto</text>
      <text class="card-text" x="20" y="94">paper.md</text>
      <text class="card-text" x="20" y="120">images/*</text>
    </g>

    <g transform="translate(28 292)">
      <rect x="0" y="0" width="229" height="164" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="card-title" x="20" y="31">再规范化</text>
      <text class="card-text" x="20" y="64">markdown-normalize@0.1</text>
      <text class="card-text" x="20" y="92">清理换行 / 空白 / BOM</text>
      <text class="mono" x="20" y="124">text-corpus</text>
      <text class="tiny" x="20" y="148">统一字段、可校验、可复用</text>
    </g>
  </g>

  <g transform="translate(1154 272)">
    <path d="M0 155 H90" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="7" y="28" width="82" height="124" rx="16" fill="#ecfeff" stroke="#99f6e4"/>
    <text class="processor-title" x="18" y="56">LLM</text>
    <text class="processor-text" x="18" y="82">QA Gen</text>
    <text class="processor-text" x="18" y="104">Summary</text>
    <text class="processor-text" x="18" y="126">Gateway</text>
  </g>

  <g transform="translate(1250 165)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="526" rx="22" fill="#ffffff" stroke="#f0c36a"/>
    <rect x="0" y="0" width="110" height="92" rx="22" fill="url(#gold)"/>
    <path d="M0 70 h110 v22 h-110 z" fill="url(#gold)"/>
    <text class="label" x="22" y="29">GOLD</text>
    <text class="layer-sub" x="16" y="59">任务就绪</text>

    <g transform="translate(14 124)">
      <rect x="0" y="0" width="82" height="156" rx="16" fill="#fffbeb" stroke="#fde68a"/>
      <text class="mono" x="12" y="34">sft</text>
      <text class="mono" x="12" y="60">eval</text>
      <text class="mono" x="12" y="86">cpt</text>
      <text class="mono" x="12" y="112">summary</text>
      <text class="tiny" x="12" y="140">schema</text>
    </g>

    <g transform="translate(14 312)">
      <rect x="0" y="0" width="82" height="134" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="tiny" x="12" y="28">sft.jsonl</text>
      <text class="tiny" x="12" y="54">prompt</text>
      <text class="tiny" x="12" y="80">response</text>
      <text class="tiny" x="12" y="106">meta</text>
    </g>
  </g>

  <g transform="translate(82 727)">
    <rect x="0" y="0" width="1278" height="96" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="footer-title" x="28" y="32">贯穿三层的平台能力</text>
    <g transform="translate(260 22)">
      <rect x="0" y="0" width="214" height="52" rx="12" fill="#ffffff" stroke="#dbe3ea"/>
      <text class="footer-text" x="18" y="23">CAS Blob Store</text>
      <text class="tiny" x="18" y="41">sha256 内容寻址、跨层去重</text>
    </g>
    <g transform="translate(500 22)">
      <rect x="0" y="0" width="196" height="52" rx="12" fill="#ffffff" stroke="#dbe3ea"/>
      <text class="footer-text" x="18" y="23">Commit / Ref</text>
      <text class="tiny" x="18" y="41">每次转换都是可回溯版本</text>
    </g>
    <g transform="translate(722 22)">
      <rect x="0" y="0" width="246" height="52" rx="12" fill="#ffffff" stroke="#dbe3ea"/>
      <text class="footer-text" x="18" y="23">Lineage</text>
      <text class="tiny" x="18" y="41">输入 commit + processor + config hash</text>
    </g>
    <g transform="translate(994 22)">
      <rect x="0" y="0" width="246" height="52" rx="12" fill="#ffffff" stroke="#dbe3ea"/>
      <text class="footer-text" x="18" y="23">Pipeline Recipe</text>
      <text class="tiny" x="18" y="41">YAML DAG 串起 Bronze → Silver → Gold</text>
    </g>
  </g>

  <g transform="translate(374 714)">
    <path d="M142 0 C142 -38,142 -70,142 -96" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  </g>
  <g transform="translate(861 714)">
    <path d="M142 0 C142 -38,142 -70,142 -96" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  </g>
  <g transform="translate(1250 714)">
    <path d="M55 0 C55 -38,55 -70,55 -96" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  </g>

  <g transform="translate(82 842)">
    <text class="tiny" x="0" y="0">Example path: PDF upload → bronze/demo/raw-pdf@main → pdf-mineru → silver/demo/pdf-md@auto → markdown-normalize → silver/demo/text-corpus@auto → llm-qa-gen → gold/demo/sft@auto</text>
  </g>
</svg>
