[project]
name = "dataplat-workspace"
version = "0.0.0"
description = "LLM 训练数据管理平台（dataplat）的 uv workspace 根"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/core",
    "packages/sdk-py",
    "worker",
]

[tool.uv.sources]
dataplat-core = { workspace = true }
dataplat-sdk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "ASYNC",
]
ignore = [
    "E501",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入语法要求 Depends(...) 写在参数默认值里——是 B008 的官方例外
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# boto3 / botocore 无内置 type stubs；本变更不引入 boto3-stubs（额外 ~30 MB），后续 follow-up 可加
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# typer 的 @app.command 装饰器在 strict 模式被判 "untyped decorator"。typer 0.12+ 类型
# 提示完善，我们 trust 装饰器返 typer.models.CommandInfo；关掉这一项检查。
module = ["dataplat_sdk.cli"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# typer / click 在 strict 模式找不到 stub（实际 typer 0.12+ 自带 py.typed，但
# mypy 在 workspace 模式下可能解析失败）；忽略 missing imports
module = ["typer", "typer.*", "click", "click.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "packages/core/tests", "worker/tests"]
addopts = ["-ra", "--strict-markers"]
